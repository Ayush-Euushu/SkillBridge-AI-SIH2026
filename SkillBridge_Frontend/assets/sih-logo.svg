<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7800"/>
      <stop offset="50%" stop-color="#ff9933"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c853"/>
      <stop offset="50%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#007e33"/>
    </linearGradient>
    <linearGradient id="glowHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.15)"/>
      <stop offset="100%" stop-color="rgba(249,115,22,0.1)"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagonal Tech Backdrop -->
  <polygon points="250,30 430,135 430,345 250,450 70,345 70,135" 
           fill="url(#glowHex)" 
           stroke="rgba(148, 163, 184, 0.3)" 
           stroke-width="3" 
           stroke-dasharray="8 6"/>

  <!-- Radiating Energy Rays -->
  <line x1="250" y1="50" x2="250" y2="85" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
  <line x1="140" y1="110" x2="165" y2="135" stroke="#ff7800" stroke-width="6" stroke-linecap="round"/>
  <line x1="360" y1="110" x2="335" y2="135" stroke="#138808" stroke-width="6" stroke-linecap="round"/>
  <line x1="90" y1="240" x2="125" y2="240" stroke="#ff7800" stroke-width="6" stroke-linecap="round"/>
  <line x1="410" y1="240" x2="375" y2="240" stroke="#138808" stroke-width="6" stroke-linecap="round"/>
  <line x1="145" y1="365" x2="175" y2="340" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <line x1="355" y1="365" x2="325" y2="340" stroke="#475569" stroke-width="6" stroke-linecap="round"/>

  <!-- Central Lightbulb Outline Frame -->
  <path d="M190,340 C145,295 135,230 160,170 C185,110 240,90 250,90 C260,90 315,110 340,170 C365,230 355,295 310,340 Z" 
        fill="none" 
        stroke="#94a3b8" 
        stroke-width="1.5" 
        stroke-opacity="0.4"/>

  <!-- LEFT HEMISPHERE: Saffron/Orange Brain & Circuitry -->
  <g filter="url(#neonGlow)">
    <path d="M 245,100 
             C 210,102 185,118 165,142 
             C 142,168 140,205 145,235 
             C 142,260 152,285 170,305 
             C 185,322 215,335 245,338 Z" 
          fill="url(#saffronGrad)"/>

    <!-- Brain gyri cutouts and circuit lines -->
    <path d="M 235,125 C 200,128 185,145 180,165 C 210,165 220,185 200,205 C 175,205 165,230 175,250 C 190,250 200,270 185,290 C 210,295 235,315 235,315" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="4.5" 
          stroke-linecap="round"/>
    <circle cx="200" cy="145" r="4" fill="#ffffff"/>
    <circle cx="170" cy="220" r="4" fill="#ffffff"/>
    <circle cx="215" cy="265" r="4" fill="#ffffff"/>
  </g>

  <!-- RIGHT HEMISPHERE: Green Brain & Binary Code -->
  <g filter="url(#neonGlow)">
    <path d="M 255,100 
             C 290,102 315,118 335,142 
             C 358,168 360,205 355,235 
             C 358,260 348,285 330,305 
             C 315,322 285,335 255,338 Z" 
          fill="url(#greenGrad)"/>

    <!-- Binary Code Overlay in Tech Font -->
    <text x="268" y="145" fill="#ffffff" font-family="'Courier New', monospace" font-weight="bold" font-size="22" letter-spacing="3">1010</text>
    <text x="268" y="180" fill="#ffffff" font-family="'Courier New', monospace" font-weight="bold" font-size="22" letter-spacing="3">01010</text>
    <text x="268" y="215" fill="#ffffff" font-family="'Courier New', monospace" font-weight="bold" font-size="22" letter-spacing="3">101010</text>
    <text x="268" y="250" fill="#ffffff" font-family="'Courier New', monospace" font-weight="bold" font-size="22" letter-spacing="3">010101</text>
    <text x="268" y="285" fill="#ffffff" font-family="'Courier New', monospace" font-weight="bold" font-size="22" letter-spacing="3">10101</text>
    <text x="268" y="320" fill="#ffffff" font-family="'Courier New', monospace" font-weight="bold" font-size="22" letter-spacing="3">010</text>
  </g>

  <!-- BULB BASE / SOCKET -->
  <g>
    <!-- Base Threads -->
    <path d="M 220,345 L 280,345 C 285,345 285,355 280,355 L 220,355 C 215,355 215,345 220,345 Z" fill="#64748b"/>
    <path d="M 224,360 L 276,360 C 280,360 280,370 276,370 L 224,370 C 220,370 220,360 224,360 Z" fill="#64748b"/>
    <path d="M 230,375 L 270,375 C 274,375 274,383 270,383 L 230,383 C 226,383 226,375 230,375 Z" fill="#475569"/>

    <!-- SIH Acronym -->
    <text x="250" y="420" text-anchor="middle" fill="#1e293b" font-family="'Outfit', sans-serif" font-weight="900" font-size="34" letter-spacing="6">SIH</text>
  </g>
</svg>
